<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1440" viewBox="0 0 1900 1440" role="img" aria-labelledby="title desc">
  <title id="title">Modelo de datos del MVP de BuyerBrain</title>
  <desc id="desc">Diagrama de catorce tablas agrupadas en marca y configuración, datos de Tiendanube, automatización y resultados.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.group{fill:#eaf2ff;stroke:#b9cff5;stroke-width:2}.box{fill:#fff;stroke:#315b96;stroke-width:2}.head{fill:#315b96}.title{font:700 28px Arial,sans-serif;fill:#17345f}.gtitle{font:700 18px Arial,sans-serif;fill:#315b96}.name{font:700 16px Arial,sans-serif;fill:#fff}.field{font:13px Consolas,monospace;fill:#1f2937}.rel{fill:none;stroke:#64748b;stroke-width:2}.label{font:12px Arial,sans-serif;fill:#334155}.legend{font:14px Arial,sans-serif;fill:#334155}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1900" height="1440"/>
  <text class="title" x="50" y="48">BuyerBrain · Modelo de datos del MVP</text>
  <text class="legend" x="50" y="76">PK = clave principal · FK = vínculo con otra tabla · 1→N = uno puede relacionarse con muchos</text>

  <rect class="group" x="30" y="100" width="430" height="1260" rx="18"/><text class="gtitle" x="55" y="132">Marca y configuración</text>
  <rect class="group" x="490" y="100" width="430" height="1260" rx="18"/><text class="gtitle" x="515" y="132">Datos sincronizados</text>
  <rect class="group" x="950" y="100" width="430" height="1260" rx="18"/><text class="gtitle" x="975" y="132">Automatización</text>
  <rect class="group" x="1410" y="100" width="460" height="1260" rx="18"/><text class="gtitle" x="1435" y="132">Resultados y fallas</text>

  <!-- relationship lines are drawn behind the entity boxes -->
  <g class="rel" marker-end="url(#arrow)">
    <path d="M245 325 V365"/><path d="M245 325 C90 345 90 650 55 650"/><path d="M245 325 C440 345 440 990 405 990"/>
    <path d="M245 325 C470 330 470 215 515 215"/><path d="M245 325 C470 350 470 465 515 465"/><path d="M245 325 C470 430 470 735 515 735"/><path d="M245 325 C470 520 470 1110 515 1110"/>
    <path d="M245 325 C900 320 900 250 1435 250"/><path d="M705 360 V620"/><path d="M705 585 V620"/>
    <path d="M705 850 V905"/><path d="M705 585 C900 585 900 690 975 690"/><path d="M1165 415 V620"/><path d="M1165 800 V875"/><path d="M1165 1035 V1110"/>
    <path d="M1165 1270 C1350 1270 1350 410 1435 410"/><path d="M1640 570 V640"/><path d="M245 585 C920 585 920 1160 975 1160"/>
    <path d="M705 850 C1100 850 1100 1140 1435 1140"/><path d="M1165 1035 C1360 1035 1360 1140 1435 1140"/>
  </g>

  <!-- column 1 -->
  <g transform="translate(55 160)"><rect class="box" width="380" height="165" rx="10"/><rect class="head" width="380" height="34" rx="10"/><text class="name" x="14" y="23">MARCAS</text><text class="field" x="14" y="58">id · PK</text><text class="field" x="14" y="81">nombre</text><text class="field" x="14" y="104">estado · plan_o_prueba</text><text class="field" x="14" y="127">automatizacion_activa</text><text class="field" x="14" y="150">alta_en · baja_en</text></g>
  <g transform="translate(55 365)"><rect class="box" width="380" height="145" rx="10"/><rect class="head" width="380" height="34" rx="10"/><text class="name" x="14" y="23">CUENTAS</text><text class="field" x="14" y="58">id · PK</text><text class="field" x="14" y="81">marca_id · FK</text><text class="field" x="14" y="104">email · nombre_visible</text><text class="field" x="14" y="127">estado · ultimo_acceso</text></g>
  <g transform="translate(55 550)"><rect class="box" width="380" height="175" rx="10"/><rect class="head" width="380" height="34" rx="10"/><text class="name" x="14" y="23">CONEXIONES</text><text class="field" x="14" y="58">id · PK</text><text class="field" x="14" y="81">marca_id · FK</text><text class="field" x="14" y="104">tipo · identificador_externo</text><text class="field" x="14" y="127">estado · permisos</text><text class="field" x="14" y="150">conectado_en · error_en</text></g>
  <g transform="translate(55 765)"><rect class="box" width="380" height="225" rx="10"/><rect class="head" width="380" height="34" rx="10"/><text class="name" x="14" y="23">POLITICAS_MARKETING</text><text class="field" x="14" y="58">id · PK</text><text class="field" x="14" y="81">marca_id · FK</text><text class="field" x="14" y="104">version · descuento_maximo</text><text class="field" x="14" y="127">margen_minimo · stock_minimo</text><text class="field" x="14" y="150">frecuencia_dias · vencimiento</text><text class="field" x="14" y="173">exclusiones</text><text class="field" x="14" y="196">vigente_desde · vigente_hasta</text></g>

  <!-- column 2 -->
  <g transform="translate(515 160)"><rect class="box" width="380" height="200" rx="10"/><rect class="head" width="380" height="34" rx="10"/><text class="name" x="14" y="23">CLIENTES</text><text class="field" x="14" y="58">id · PK</text><text class="field" x="14" y="81">marca_id · FK</text><text class="field" x="14" y="104">identificador_externo</text><text class="field" x="14" y="127">contacto_telegram</text><text class="field" x="14" y="150">consentimiento_estado</text><text class="field" x="14" y="173">consentimiento_fecha</text></g>
  <g transform="translate(515 400)"><rect class="box" width="380" height="185" rx="10"/><rect class="head" width="380" height="34" rx="10"/><text class="name" x="14" y="23">PRODUCTOS</text><text class="field" x="14" y="58">id · PK</text><text class="field" x="14" y="81">marca_id · FK</text><text class="field" x="14" y="104">identificador_externo · nombre</text><text class="field" x="14" y="127">precio_actual · stock</text><text class="field" x="14" y="150">estado</text></g>
  <g transform="translate(515 620)"><rect class="box" width="380" height="230" rx="10"/><rect class="head" width="380" height="34" rx="10"/><text class="name" x="14" y="23">CARRITOS</text><text class="field" x="14" y="58">id · PK</text><text class="field" x="14" y="81">marca_id · FK</text><text class="field" x="14" y="104">cliente_id · FK</text><text class="field" x="14" y="127">identificador_externo</text><text class="field" x="14" y="150">creado_en · detectado_en</text><text class="field" x="14" y="173">total</text><text class="field" x="14" y="196">estado</text></g>
  <g transform="translate(515 905)"><rect class="box" width="380" height="205" rx="10"/><rect class="head" width="380" height="34" rx="10"/><text class="name" x="14" y="23">ITEMS_CARRITO</text><text class="field" x="14" y="58">id · PK</text><text class="field" x="14" y="81">carrito_id · FK</text><text class="field" x="14" y="104">producto_id · FK</text><text class="field" x="14" y="127">cantidad</text><text class="field" x="14" y="150">precio_unitario</text><text class="field" x="14" y="173">subtotal</text></g>

  <!-- column 3 -->
  <g transform="translate(975 160)"><rect class="box" width="380" height="255" rx="10"/><rect class="head" width="380" height="34" rx="10"/><text class="name" x="14" y="23">EVALUACIONES</text><text class="field" x="14" y="58">id · PK</text><text class="field" x="14" y="81">carrito_id · FK</text><text class="field" x="14" y="104">politica_id · FK</text><text class="field" x="14" y="127">evaluado_en · resultado</text><text class="field" x="14" y="150">motivo</text><text class="field" x="14" y="173">controles_realizados</text><text class="field" x="14" y="196">grupo_control</text><text class="field" x="14" y="225">Carrito 1 → 0..1 evaluación</text></g>
  <g transform="translate(975 475)"><rect class="box" width="380" height="230" rx="10"/><rect class="head" width="380" height="34" rx="10"/><text class="name" x="14" y="23">PROMOCIONES</text><text class="field" x="14" y="58">id · PK</text><text class="field" x="14" y="81">evaluacion_id · FK</text><text class="field" x="14" y="104">porcentaje · explicacion</text><text class="field" x="14" y="127">codigo_cupon</text><text class="field" x="14" y="150">vence_en</text><text class="field" x="14" y="173">estado_cupon</text><text class="field" x="14" y="202">Evaluación 1 → 0..1 promoción</text></g>
  <g transform="translate(975 765)"><rect class="box" width="380" height="270" rx="10"/><rect class="head" width="380" height="34" rx="10"/><text class="name" x="14" y="23">ENVIOS</text><text class="field" x="14" y="58">id · PK</text><text class="field" x="14" y="81">promocion_id · FK</text><text class="field" x="14" y="104">conexion_id · FK</text><text class="field" x="14" y="127">identificador_externo</text><text class="field" x="14" y="150">estado</text><text class="field" x="14" y="173">enviado_en</text><text class="field" x="14" y="196">actualizado_en</text><text class="field" x="14" y="235">Promoción 1 → 0..1 envío</text></g>

  <!-- column 4 -->
  <g transform="translate(1435 160)"><rect class="box" width="410" height="250" rx="10"/><rect class="head" width="410" height="34" rx="10"/><text class="name" x="14" y="23">PEDIDOS</text><text class="field" x="14" y="58">id · PK</text><text class="field" x="14" y="81">marca_id · FK</text><text class="field" x="14" y="104">cliente_id · FK</text><text class="field" x="14" y="127">identificador_externo · comprado_en</text><text class="field" x="14" y="150">subtotal · descuento · total</text><text class="field" x="14" y="173">estado</text><text class="field" x="14" y="215">Cliente 1 → N pedidos</text></g>
  <g transform="translate(1435 470)"><rect class="box" width="410" height="260" rx="10"/><rect class="head" width="410" height="34" rx="10"/><text class="name" x="14" y="23">ATRIBUCIONES</text><text class="field" x="14" y="58">id · PK</text><text class="field" x="14" y="81">promocion_id · FK</text><text class="field" x="14" y="104">pedido_id · FK opcional</text><text class="field" x="14" y="127">resultado</text><text class="field" x="14" y="150">cerrado_en</text><text class="field" x="14" y="173">ventana_horas</text><text class="field" x="14" y="196">monto_recuperado</text><text class="field" x="14" y="230">Promoción 1 → 0..1 atribución</text></g>
  <g transform="translate(1435 790)"><rect class="box" width="410" height="350" rx="10"/><rect class="head" width="410" height="34" rx="10"/><text class="name" x="14" y="23">INCIDENCIAS</text><text class="field" x="14" y="58">id · PK</text><text class="field" x="14" y="81">marca_id · FK</text><text class="field" x="14" y="104">conexion_id · FK opcional</text><text class="field" x="14" y="127">carrito_id · FK opcional</text><text class="field" x="14" y="150">envio_id · FK opcional</text><text class="field" x="14" y="173">tipo · descripcion</text><text class="field" x="14" y="196">estado · ocurrio_en</text><text class="field" x="14" y="219">resolucion</text><text class="field" x="14" y="265">Puede señalar una conexión,</text><text class="field" x="14" y="288">un carrito o un envío.</text></g>

  <g transform="translate(55 1160)"><rect class="box" width="840" height="145" rx="10"/><text class="gtitle" x="20" y="32">Lectura del recorrido principal</text><text class="legend" x="20" y="62">Marca → carrito → evaluación → promoción → envío → atribución.</text><text class="legend" x="20" y="88">Si la evaluación se bloquea, el recorrido termina sin promoción.</text><text class="legend" x="20" y="114">Si existe compra dentro de la ventana, la atribución apunta al pedido.</text></g>
</svg>
